# A tag vX.Y.Z on a commit of main publishes pin-promote-X.Y.Z.pyz and its .sha256 as a GitHub
# release, once the test suite passed on every supported Python and the lint, type and build checks
# of ci.yml passed too. The asset is reproducible: scripts/build-pyz.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  supported:
    if: ${{ !github.event.repository.private }}
    uses: ./.github/workflows/supported.yml

  checks:
    if: ${{ !github.event.repository.private }}
    uses: ./.github/workflows/ci.yml

  publish:
    name: publish the release
    needs: [supported, checks]
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the whole history, to tell whether the tagged commit is on main
          persist-credentials: false

      - name: The tagged commit is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$GITHUB_REF_NAME ($GITHUB_SHA) is not on main" >&2; exit 1; }

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: The tag is the version in the source
        run: |
          version=$(python3 -I bin/pin-promote --version | cut -d' ' -f2)
          test "$GITHUB_REF_NAME" = "v$version" || { echo "tag $GITHUB_REF_NAME, source $version" >&2; exit 1; }

      - name: Build
        run: scripts/build-pyz

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/pin-promote-*.pyz dist/pin-promote-*.pyz.sha256 --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
